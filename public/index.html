<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express App - Hello World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .api-section {
            margin-top: 30px;
        }

        .api-title {
            font-size: 1.3rem;
            color: #444;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .button-group {
            display: grid;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .response-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            min-height: 100px;
            position: relative;
            border: 2px solid #e0e0e0;
        }

        .response-label {
            position: absolute;
            top: -12px;
            left: 20px;
            background: white;
            padding: 0 10px;
            color: #667eea;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .response-content {
            font-family: 'Courier New', monospace;
            color: #333;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello World! 🚀</h1>
        <p class="subtitle">Welcome to your Express.js Application</p>
        
        <div class="api-section">
            <h2 class="api-title">Test API Endpoints</h2>
            
            <div class="button-group">
                <button onclick="testHello()">Test Hello API</button>
                <button onclick="testTime()">Get Server Time</button>
            </div>
            
            <div class="input-group">
                <input type="text" id="echoInput" placeholder="Enter message to echo...">
                <button onclick="testEcho()">Send Echo</button>
            </div>
        </div>
        
        <div class="response-box">
            <span class="response-label">API Response</span>
            <div id="response" class="response-content">Click a button to test the API...</div>
        </div>
        
        <div id="status" class="status" style="display: none;"></div>
    </div>

    <script>
        const responseDiv = document.getElementById('response');
        const statusDiv = document.getElementById('status');

        function showLoading() {
            responseDiv.innerHTML = 'Loading<span class="loading"></span>';
        }

        function showResponse(data, isError = false) {
            responseDiv.textContent = JSON.stringify(data, null, 2);
            
            statusDiv.style.display = 'block';
            if (isError) {
                statusDiv.className = 'status error';
                statusDiv.textContent = '❌ Request failed';
            } else {
                statusDiv.className = 'status success';
                statusDiv.textContent = '✅ Request successful';
            }
            
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 3000);
        }

        async function testHello() {
            showLoading();
            try {
                const response = await fetch('/api/hello');
                const data = await response.json();
                showResponse(data);
            } catch (error) {
                showResponse({ error: error.message }, true);
            }
        }

        async function testTime() {
            showLoading();
            try {
                const response = await fetch('/api/time');
                const data = await response.json();
                showResponse(data);
            } catch (error) {
                showResponse({ error: error.message }, true);
            }
        }

        async function testEcho() {
            const input = document.getElementById('echoInput').value;
            if (!input.trim()) {
                showResponse({ error: 'Please enter a message to echo' }, true);
                return;
            }
            
            showLoading();
            try {
                const response = await fetch('/api/echo', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: input })
                });
                const data = await response.json();
                showResponse(data);
                document.getElementById('echoInput').value = '';
            } catch (error) {
                showResponse({ error: error.message }, true);
            }
        }

        // Allow Enter key to submit echo
        document.getElementById('echoInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                testEcho();
            }
        });
    </script>
</body>
</html>
